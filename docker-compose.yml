services:
  frontend:
    build: ./frontend
    container_name: esset-frontend
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    expose: ['3000']
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:3000'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [essetnet]

  proxy:
    build: ./reverse-proxy
    container_name: esset-proxy
    ports:
      - '8080:80'
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [essetnet]

  redis:
    image: redis:7-alpine
    container_name: esset-redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    expose: ['6379']
    networks: [essetnet]

  backend:
    build: ./backend
    container_name: esset-backend
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGO_URI=${MONGO_URI}

      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}

      - CDN_BASE_URL=${CDN_BASE_URL}
      - ADMIN_TOKEN=${ADMIN_TOKEN}

      # --- Redis/BullMQ 추가 ---
      - REDIS_HOST=redis # 컨테이너에서 '127.0.0.1'은 자기 자신 → 반드시 서비스명 사용
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - QUEUE_PREFIX=asset
      - QUEUE_NAME=thumbnail_queue
      # (원하면) QUEUE_ENABLED=true  # 안전장치용, 아래 3) 참고
    expose: ['4000']
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:4000/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 30
    networks: [essetnet]
    volumes:
      - ./backend/logs:/usr/src/app/logs

volumes:
  redis_data:

networks:
  essetnet:
    driver: bridge
