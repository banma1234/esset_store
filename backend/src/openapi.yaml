openapi: 3.0.3
info:
  title: Common Code API
  version: 1.0.0
paths:
  /api/v1/commonCode:
    get:
      summary: Get all common codes or a common code by code
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: The common code to retrieve
      responses:
        '200':
          description: Successful response with common code(s)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CommonCodeResponse'
                  - $ref: '#/components/schemas/CommonCodesResponse'
        '404':
          description: Common code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new common code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonCodeCreateRequest'
      responses:
        '201':
          description: Common code created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    put:
      summary: Update an existing common code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonCodeUpdateRequest'
      responses:
        '201':
          description: Common code updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    all:
      summary: Method Not Allowed
      description: Method Not Allowed
      responses:
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/assets/search:
    get:
      summary: 에셋 검색 (카테고리 + 필터 + 페이지네이션)
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: 카테고리 코드
        - name: filters
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: 필터 코드 배열
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: 페이지 번호
      responses:
        '200':
          description: 에셋 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas.AssetsSearchResponse'
        '500':
          description: 검색 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/assets:
    get:
      summary: 에셋 이름으로 안전하게 에셋 가져오기
      parameters:
        - name: filename
          in: query
          required: true
          schema:
            type: string
          description: 에셋 이름
      responses:
        '200':
          description: 에셋 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas.AssetResponse'
        '404':
          description: 해당 에셋을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/assets/download:
    get:
      summary: 외부 에셋 다운로드 API
      parameters:
        - name: filename
          in: query
          required: false
          schema:
            type: string
          description: 에셋 이름
        - name: assetid
          in: query
          required: false
          schema:
            type: string
          description: 에셋 _id
      responses:
        '200':
          description: 다운로드 URL 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas.AssetDownloadResponse'
        '422':
          description: 다운로드 요청 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/assets/delete:
    put:
      summary: 에셋 비활성화 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas.AssetIdRequest'
      responses:
        '200':
          description: 에셋 비활성화 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/v1/assets/activate:
    put:
      summary: 에셋 활성화 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas.AssetIdRequest'
      responses:
        '200':
          description: 에셋 활성화 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/v1/storage/presign:
    post:
      summary: 프리사인 URL 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas.PresignRequest'
      responses:
        '200':
          description: presigned GET URL 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas.PresignResponse'
        '201':
          description: presigned PUT URL 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas.PresignResponse'
        '405':
          description: 허용되지 않는 method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CommonCode:
      type: object
      properties:
        code:
          type: string
          description: The unique common code identifier
        description:
          type: string
          description: Description of the common code
      required:
        - code
        - description
      additionalProperties: false
    CommonCodeCreateRequest:
      type: object
      properties:
        code:
          type: string
          description: The unique common code identifier
        description:
          type: string
          description: Description of the common code
      required:
        - code
        - description
      additionalProperties: false
    CommonCodeUpdateRequest:
      type: object
      properties:
        code:
          type: string
          description: The unique common code identifier, to identify which to update
        description:
          type: string
          description: New description of the common code
      required:
        - code
        - description
      additionalProperties: false
    CommonCodeResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CommonCode'
      required:
        - ok
        - data
      additionalProperties: false
    CommonCodesResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommonCode'
      required:
        - ok
        - data
      additionalProperties: false
    SuccessResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required:
        - ok
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        message:
          type: string
      required:
        - ok
        - message
      additionalProperties: false
    Asset:
      type: object
      properties:
        id:
          type: string
          description: Asset unique identifier
        filename:
          type: string
          description: Asset file name
        category:
          type: string
          description: Asset category code
        filters:
          type: array
          items:
            type: string
          description: List of filter codes applied to the asset
        active:
          type: boolean
          description: Whether the asset is active
        createdAt:
          type: string
          format: date-time
          description: Asset creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Asset last update timestamp
      required:
        - id
        - filename
        - category
        - filters
        - active
        - createdAt
        - updatedAt
      additionalProperties: false
    AssetsSearchResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
      required:
        - ok
        - data
      additionalProperties: false
    AssetResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Asset'
      required:
        - ok
        - data
      additionalProperties: false
    AssetDownloadResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        url:
          type: string
          format: uri
          description: Download URL for the asset
      required:
        - ok
        - url
      additionalProperties: false
    AssetIdRequest:
      type: object
      properties:
        id:
          type: string
          description: Asset unique identifier
      required:
        - id
      additionalProperties: false
    PresignRequest:
      type: object
      properties:
        key:
          type: string
          description: Object key for storage
        contentType:
          type: string
          description: MIME content type of the object (required for PUT)
        expiresSec:
          type: integer
          description: URL expiration time in seconds
          minimum: 1
          nullable: true
      required:
        - key
      additionalProperties: false
    PresignResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: Presigned URL
            fields:
              type: object
              description: Additional fields required for upload (optional, mainly for POST)
          additionalProperties: true
      required:
        - ok
        - data
      additionalProperties: false